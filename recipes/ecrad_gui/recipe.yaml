context:
  version: "1.0.23"

package:
  name: ecrad_gui
  version: ${{ version }}

source:
  git: https://github.com/AreWeDreaming/ECRad_GUI
  tag: ${{ version }}

build:
  number: 1
  python:
    entry_points:
      - ecrad_gui = ecrad_gui.ECRad_GUI_Application:main

requirements:
  host:
    - python
    - pip >=21.0
    - setuptools >=57.4
  run:
    - python
    - numpy <=1.26
    - scipy >=1.7.3
    - matplotlib
    - hdf5
    - netcdf4 >=1.5.6
    - h5py
    - wxpython
    - f90nml >=1.3.1
    - plasma_math_tools
    - ecrad_core >=1.0.31
    - ecrad_pylib >=1.0.24
