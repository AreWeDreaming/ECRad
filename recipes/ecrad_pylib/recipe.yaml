context:
  version: "1.0.24"

package:
  name: ecrad_pylib
  version: ${{ version }}

source:
  git: https://github.com/AreWeDreaming/ECRad_PyLib
  tag: ${{ version }}

build:
  number: 0

requirements:
  host:
    - python
    - pip >=21.0
    - setuptools >=57.4
  run:
    - python
    - numpy <=1.26
    - scipy >=1.7.3
    - matplotlib
    - hdf5
    - netcdf4 >=1.5.6
    - h5py
    - wxpython
    - f90nml >=1.3.1
    - plasma_math_tools
    - ecrad_core >=1.0.31
    - psutil
    - cython
    - omas
    - mdsplus ==7.139.59
