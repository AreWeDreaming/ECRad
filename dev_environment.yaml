name: ECRad
channels:
  - conda-forge
  - arewedreaming
dependencies:
  - python
  - numpy <=1.26
  - scipy >=1.7.3
  - matplotlib
  - hdf5
  - netcdf4 >=1.5.6
  - h5py
  - wxpython
  - f90nml >=1.3.1
  - plasma_math_tools
  - psutil
  - mdsplus ==7.139.59 # 7.139.65 and 7.139.67 are broken
  - omas >= 0.97.4 # need ece.time mapping for d3d
  - make
  - gfortran
  - binutils
  - openblas
  - pip >=21.0
  - setuptools >=57.4,<74 # numpy.distutils (f2py) needs distutils.msvccompiler
  - rattler-build
